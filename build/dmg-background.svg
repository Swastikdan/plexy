<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECECEF" />
      <stop offset="0.38" stop-color="#F4F4F6" />
      <stop offset="0.72" stop-color="#F1F1F4" />
      <stop offset="1" stop-color="#E7E7EB" />
    </linearGradient>

    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="0.45" stop-color="#EFEFF2" stop-opacity="0.75" />
      <stop offset="1" stop-color="#D8D8DF" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFCFD" />
      <stop offset="1" stop-color="#F3F3F6" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="-6%" r="72%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <filter id="soft" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
    <filter id="soft-sm" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <!-- Base wash -->
  <rect width="1280" height="800" fill="url(#base)" />
  <rect width="1280" height="520" fill="url(#glow)" />

  <!-- Rolling ribbon kept below the icon row, behind the caption -->
  <path
    d="M-60 486 C 160 444 340 444 540 484 C 740 524 900 514 1060 482 C 1170 460 1240 462 1340 484 L1340 736 C 1150 764 1000 706 820 728 C 600 756 400 806 180 778 C 80 764 10 748 -60 732 Z"
    fill="url(#hill)"
    filter="url(#soft)"
  />

  <!-- Faint shadow under the ribbon crest -->
  <path
    d="M-40 498 C 160 456 336 456 524 496 C 722 538 884 526 1044 492 C 1164 466 1244 468 1320 494"
    fill="none"
    stroke="#8E8E96"
    stroke-opacity="0.26"
    stroke-width="10"
    filter="url(#soft-sm)"
  />

  <!-- Bottom sheet -->
  <path
    d="M-40 776 C 170 730 330 766 520 774 C 740 784 900 740 1080 740 C 1180 740 1250 752 1320 766 L1320 840 L-40 840 Z"
    fill="url(#sheet)"
    filter="url(#soft-sm)"
  />
  <path
    d="M-40 776 C 170 730 330 766 520 774 C 740 784 900 740 1080 740 C 1180 740 1250 752 1320 766"
    fill="none"
    stroke="#8F8F97"
    stroke-opacity="0.14"
    stroke-width="6"
    filter="url(#soft-sm)"
  />

  <!-- Wordmark, safely above the icon row -->
  <text
    x="58"
    y="92"
    font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="46"
    font-weight="700"
    letter-spacing="-1.4"
    fill="#242327"
  >Plexy</text>

  <!-- Caption, moved below the app / Applications icons and their labels -->
  <text
    x="640"
    y="600"
    text-anchor="middle"
    font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="46"
    font-weight="700"
    letter-spacing="-0.6"
    fill="#403F45"
  >Drag Plexy into Applications.</text>

  <!-- Footnote -->
  <text
    x="640"
    y="700"
    text-anchor="middle"
    font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="24"
    font-weight="500"
    fill="#57565C"
  >Once copied, open it from Applications.</text>
</svg>
