plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.plexydownloads'
version = '1.0.0'

android {
  namespace 'expo.modules.plexydownloads'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
