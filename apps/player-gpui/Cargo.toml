[package]
name = "plexy-player"
version = "0.1.1"
edition = "2021"
publish = false
description = "Local-file Plexy player for Apple Silicon macOS, built on GPUI and libmpv."

[dependencies]
gpui-kit = "=0.11.0"
anyhow = "1"
parking_lot = "0.12"
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
security-framework = "3.7"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

[dev-dependencies]
# Same source and version as the normal dependency, plus headless UI testing.
gpui-kit = { version = "=0.11.0", features = ["test-support"] }

[build-dependencies]
cc = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "symbols"
