<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="Plexy is your personal film and TV library, streamed from your own machine with local metadata, artwork, and watch progress."
    />
    <meta name="application-name" content="Plexy Client" />
    <meta name="apple-mobile-web-app-title" content="Plexy" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Plexy · Personal Media</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      try {
        localStorage.removeItem("plexy-theme");
      } catch (e) {}
      document.documentElement.dataset.theme = "dark";
    </script>
    <!-- Boot splash: inline so it paints on the very first frame, before any
         JS or font has loaded. It self-removes once the app mounts, so on a
         warm cache it is never visible and on a slow load the window never
         sits blank. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #080808;
        color: #ededed;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 200ms ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-word {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: lowercase;
      }
      #boot .boot-ring {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.08);
        border-top-color: rgba(255, 255, 255, 0.55);
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-ring {
          animation: none;
        }
        #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="boot" aria-hidden="true">
      <div class="boot-word">plexy</div>
      <div class="boot-ring"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
