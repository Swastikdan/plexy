<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="Plexy is your personal film and TV library, streamed from your own machine with local metadata, artwork, and watch progress."
    />
    <meta name="application-name" content="Plexy Client" />
    <meta name="apple-mobile-web-app-title" content="Plexy" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Plexy · Personal Media</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      try {
        localStorage.removeItem("plexy-theme");
      } catch (e) {}
      document.documentElement.dataset.theme = "dark";
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
