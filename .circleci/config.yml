version: 2.1

parameters:
  macos-target:
    type: enum
    enum: [none, desktop, backend]
    default: none
  release-sha:
    type: string
    default: ""

functions:
  setup-node: github.com/circleci-functions/setup-node@v0.5.0

jobs:
  package-macos:
    macos:
      xcode: "26.6"
    resource_class: m4pro.medium
    environment:
      SKIP_FFMPEG: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_SHA: << pipeline.parameters.release-sha >>
      MACOS_TARGET: << pipeline.parameters.macos-target >>
    steps:
      - checkout:
          method: full
      - run:
          name: Check out the verified release commit
          command: |
            test "$(uname -m)" = arm64
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main
            git checkout --detach "$RELEASE_SHA"
      - setup-node:
          with:
            node-version: "22"
      - setup-node/install-packages
      - run:
          name: Install packaged FFmpeg
          command: node scripts/install-ffmpeg.mjs
      - run:
          name: Build and verify macOS package
          command: |
            mkdir -p macos-artifacts
            case "$MACOS_TARGET" in
              desktop)
                bun run build:desktop
                app="dist/mac/mac-arm64/Plexy Beta.app"
                expected="$(node -p "require('./package.json').version")"
                actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
                test "$actual" = "$expected"
                codesign --verify --deep --strict --verbose=2 "$app"
                cp dist/mac/*.dmg dist/mac/*.zip macos-artifacts/
                ;;
              backend)
                bun run build:server
                ./dist/server/ffmpeg -version
                ./dist/server/plexy-server --version
                tar -czf macos-artifacts/plexy-server-macos-arm64.tar.gz -C dist/server .
                ;;
            esac
      - store_artifacts:
          path: macos-artifacts
          destination: macos

workflows:
  macos-release:
    when:
      and:
        - equal: [main, << pipeline.git.branch >>]
        - not:
            equal: [none, << pipeline.parameters.macos-target >>]
    jobs:
      - package-macos
