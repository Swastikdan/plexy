version: 2.1

parameters:
  macos-target:
    type: enum
    enum: [none, desktop, backend]
    default: none
  release-sha:
    type: string
    default: ""

  build-number:
    type: string
    default: ""
  backend-contents:
    type: enum
    enum: [bundle, binary]
    default: bundle

functions:
  setup-node: github.com/circleci-functions/setup-node@v0.5.0

jobs:
  package-macos:
    macos:
      xcode: "26.6"
    resource_class: m4pro.medium
    environment:
      SKIP_FFMPEG: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_SHA: << pipeline.parameters.release-sha >>
      PLEXY_BUILD_NUMBER: << pipeline.parameters.build-number >>
      BACKEND_CONTENTS: << pipeline.parameters.backend-contents >>
      MACOS_TARGET: << pipeline.parameters.macos-target >>
    steps:
      - checkout:
          method: full
      - run:
          name: Check out the verified release commit
          command: |
            test "$(uname -m)" = arm64
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main
            git checkout --detach "$RELEASE_SHA"
      - setup-node:
          with:
            node-version: "22"
      - setup-node/install-packages
      - run:
          name: Build and verify macOS package
          command: bash scripts/package-macos.sh
      - store_artifacts:
          path: release-macos
          destination: macos

workflows:
  macos-release:
    when:
      and:
        - equal: [main, << pipeline.git.branch >>]
        - not:
            equal: [none, << pipeline.parameters.macos-target >>]
    jobs:
      - package-macos
