name: Package Plexy Server
description: Build and verify a server archive for the current runner.
inputs:
  platform:
    description: Platform suffix for the server archive
    required: true
  contents:
    description: Backend archive contents (bundle or binary).
    default: bundle
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Cache Bun packages
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
    - shell: bash
      run: bun install --frozen-lockfile
      env:
        SKIP_FFMPEG: "true"
    - uses: actions/download-artifact@v8
      if: inputs.contents == 'bundle'
      with:
        name: verified-web
        path: dist/web
    - shell: bash
      env:
        BACKEND_PLATFORM: ${{ inputs.platform }}
        BACKEND_CONTENTS: ${{ inputs.contents }}
      run: bash scripts/package-backend.sh "$BACKEND_PLATFORM" "$BACKEND_CONTENTS" dist
    - uses: actions/upload-artifact@v7
      with:
        name: plexy-server-${{ inputs.platform }}
        path: dist/plexy-server-*.tar.gz
        if-no-files-found: error
