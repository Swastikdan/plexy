name: Build & Release

# Runs on every push to `main`: tests clients and server, builds all artifacts, then
# publishes a GitHub release. Static hosting is configured separately.
# Manual runs must target `main`.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: plexy-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22"

jobs:
  web:
    name: Web app build
    runs-on: ubuntu-24.04
    # Only the owner (or logins listed in the RELEASE_ACTORS repository
    # variable) can publish. Branch protection should also restrict `main`.
    if: github.ref == 'refs/heads/main' && contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor))
    outputs:
      site_url: ${{ vars.PLEXY_SITE_URL }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        # CI installs FFmpeg explicitly below; the web build does not need it.
        env:
          SKIP_FFMPEG: "true"
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build:web
        env:
          # Optional: bake a default server address into the hosted build.
          # Viewers can still change it from the connection screen.
          VITE_API_URL: ${{ vars.PLEXY_DEFAULT_SERVER_URL }}

  mac:
    name: macOS app (Apple Silicon)
    runs-on: macos-15
    if: github.ref == 'refs/heads/main' && contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor))
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        # CI installs FFmpeg explicitly below; the web build does not need it.
        env:
          SKIP_FFMPEG: "true"
        run: bun install --frozen-lockfile

      - name: Cache FFmpeg runtime
        uses: actions/cache@v4
        with:
          path: node_modules/node-av/binary
          key: ffmpeg-macos-arm64-v1-${{ hashFiles('bun.lock', 'scripts/install-macos-ffmpeg.mjs') }}

      - name: Ensure FFmpeg runtime is installed
        run: node scripts/install-macos-ffmpeg.mjs

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-macos-arm64-${{ hashFiles('bun.lock') }}
          restore-keys: electron-macos-arm64-

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Build macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run package:mac

      - name: Show artifacts
        run: ls -lh dist/mac

      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 "dist/mac/mac-arm64/Plexy Beta.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plexy-macos
          path: |
            dist/mac/*.dmg
            dist/mac/*.zip
          if-no-files-found: error
          retention-days: 14

  checks:
    name: Tests and type checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Generate web routes for a clean checkout
        run: bun run build:web
      - run: bun run typecheck
      - run: bun run typecheck:native
      - run: bun run test:server
      - run: bun run test:native

  android:
    name: Android ${{ matrix.target }} APK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [mobile, tv]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Build standalone preview APK
        run: bun scripts/native/build-preview.ts ${{ matrix.target }}
        env:
          PLEXY_ANDROID_ARCHITECTURES: arm64-v8a,armeabi-v7a,x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-android-${{ matrix.target }}
          path: .build/native/plexy-${{ matrix.target }}-preview.apk
          if-no-files-found: error

  server:
    name: Backend (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - if: runner.os == 'macOS'
        run: node scripts/install-macos-ffmpeg.mjs
      - run: bun run build:server
      - name: Smoke test backend
        run: ./dist/server/plexy-server --version
      - run: tar -czf dist/plexy-server-${{ matrix.platform }}.tar.gz -C dist/server .
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-server-${{ matrix.platform }}
          path: dist/plexy-server-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - web
      - mac
      - checks
      - android
      - server
    if: github.ref == 'refs/heads/main' && contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor))
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: plexy-*
          merge-multiple: true
          path: release

      - name: Create update checksums
        run: cd release && sha256sum *.dmg *.zip *.apk *.tar.gz > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ needs.web.outputs.site_url }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          # Give every successful run its own release, including beta builds.
          # Re-running a workflow intentionally updates that run's release.
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          if [[ "$version" == *-beta.* ]]; then
            prerelease_flag="--prerelease"
            latest_flag=""
          else
            prerelease_flag=""
            latest_flag="--latest"
          fi

          cat > release-notes.md <<EOF
          ## Plexy Beta ${tag}

          **Web app:** ${SITE_URL}

          **Install on Apple Silicon Mac:** download the DMG, open it, drag **Plexy Beta** into **Applications**, wait for it to finish copying, then eject the DMG. You can also download the ZIP, extract it, and move **Plexy Beta.app** into **Applications**.

          **Android phone/tablet:** install \`plexy-mobile-preview.apk\`. **Android TV:** sideload \`plexy-tv-preview.apk\`. These standalone preview APKs use the template test signing identity and are not store releases.

          **Backend:** extract the archive for your platform and run \`./plexy-server\`. Keep FFmpeg and migrations beside the executable. Set \`PLEXY_DATA_DIR\` to choose the data folder. Backend archives do not include the web app; connect a Plexy client.

          This release is ad-hoc signed, but it is not Developer ID signed or notarized. On first launch, macOS may say it cannot verify Plexy and block it. After trying to open Plexy from Applications:

          1. Open **System Settings → Privacy & Security**.
          2. Scroll to **Security** and click **Open Anyway** next to the Plexy message.
          3. Confirm with your password or Touch ID, then open Plexy again from **Applications** and choose **Open**.

          On some macOS versions, Control-click **Plexy.app** in Applications, choose **Open**, and confirm **Open**. If macOS still blocks it, use the Privacy & Security steps above. Only do this for a copy downloaded from this repository's GitHub Releases page.

          Advanced Terminal alternative:

              xattr -dr com.apple.quarantine "/Applications/Plexy Beta.app"

          The web app asks for your Plexy server address on first launch and remembers it on that device. The Mac app includes its own server.

          Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" release/* \
              --title "Plexy Beta ${tag}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              $prerelease_flag $latest_flag
          fi
