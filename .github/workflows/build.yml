name: Build & Release

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "macOS desktop app (DMG and ZIP)"
        type: boolean
        default: false
      linux_backend:
        description: "Linux x64 backend"
        type: boolean
        default: false
      macos_backend:
        description: "macOS Apple Silicon backend"
        type: boolean
        default: false
      android:
        description: "Android (OTA when compatible, otherwise APK)"
        type: boolean
        default: false
      backend_contents:
        description: "Backend package contents"
        type: choice
        options: [bundle, binary]
        default: bundle
      macos_runner:
        description: "Hosted runner for macOS targets"
        type: choice
        options: [auto, github, circleci]
        default: auto
      version_bump:
        description: "Desktop and general release version increment"
        type: choice
        options: [patch, minor, major]
        default: patch
      release_notes:
        description: "Optional release highlights"
        type: string
        default: ""
      mobile_update_type:
        description: "Mobile update urgency"
        type: choice
        default: optional
        options: [optional, feature, necessary]
      mobile_version_bump:
        description: "Mobile version increment"
        type: choice
        default: patch
        options: [patch, minor, major]
      mobile_force_apk:
        description: "Publish a new Android APK even when OTA is compatible"
        type: boolean
        default: false

concurrency:
  group: plexy-${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22"

jobs:
  plan:
    name: Determine build targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor))
    outputs:
      build_number: ${{ steps.reserve.outputs.build_number }}
      version: ${{ steps.reserve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Select targets and reserve a build number
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          PLEXY_VERSION_BUMP: ${{ inputs.version_bump }}
          HAS_TARGET: ${{ inputs.desktop || inputs.linux_backend || inputs.macos_backend || inputs.android }}
        run: |
          if [[ "$HAS_TARGET" != true ]]; then
            echo "::error::Select at least one release target."
            exit 1
          fi
          reservation="$(bun scripts/release-refs.ts)"
          version="$(jq -er .version <<< "$reservation")"
          build_number="$(jq -er .buildNumber <<< "$reservation")"
          printf 'version=%s\nbuild_number=%s\n' "$version" "$build_number" >> "$GITHUB_OUTPUT"
          echo "### Plexy $version (build $build_number)" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Tests and type checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Verify target selection
        run: bun test scripts/build-targets.test.ts scripts/native/mobile-delivery-state.test.ts
      - name: Verify shared packages
        run: bun run turbo run typecheck typecheck:scripts --filter=@plexy/api-client --filter=@plexy/local-library --filter=//
      - name: Build and verify embedded website
        if: inputs.desktop || ((inputs.linux_backend || inputs.macos_backend) && inputs.backend_contents == 'bundle')
        run: bun run turbo run typecheck --filter=@plexy/web
      - name: Install FFmpeg for preparation integration tests
        if: inputs.desktop || inputs.linux_backend || inputs.macos_backend
        run: node scripts/install-ffmpeg.mjs
      - name: Verify backend
        if: inputs.desktop || inputs.linux_backend || inputs.macos_backend
        run: bun run turbo run typecheck test --filter=@plexy/server
      - name: Verify desktop
        if: inputs.desktop
        run: bun run turbo run typecheck test --filter=@plexy/desktop
      - name: Verify Android clients
        if: inputs.android
        # Typecheck the suites separately from the Expo app and verify Metro's export.
        run: bun run turbo run typecheck typecheck:tests lint:strict bundle --filter=@plexy/mobile
      - name: Enforce mobile coverage floor
        if: inputs.android
        run: bun run test:native:coverage
      - name: Save mobile coverage
        if: inputs.android && always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: .build/coverage/native/lcov.info
          if-no-files-found: warn
      - name: Save verified website
        if: inputs.desktop || ((inputs.linux_backend || inputs.macos_backend) && inputs.backend_contents == 'bundle')
        uses: actions/upload-artifact@v7
        with:
          name: verified-web
          path: dist/web
          if-no-files-found: error

  mobile-delivery:
    name: Route Android delivery
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      inputs.android
    outputs:
      delivery: ${{ steps.route.outputs.delivery }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Compare published Android release and publish compatible OTA
        id: route
        working-directory: apps/mobile
        run: bun scripts/delivery.ts publish
        env:
          CI: "true"
          NODE_ENV: production
          EXPO_NO_DOTENV: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || secrets.EXPO_PUBLIC_TMDB_TOKEN || secrets.TMDB_ACCESS_TOKEN || secrets.VITE_PUBLIC_TMDB_ACCESS_TOKEN }}
          PLEXY_EXPO_PROJECT_ID: ${{ vars.PLEXY_EXPO_PROJECT_ID }}
          EXPO_PUBLIC_PLEXY_UPDATE_ORIGIN: ${{ vars.PLEXY_UPDATE_ORIGIN }}
          PLEXY_ANDROID_ARCHITECTURES: arm64-v8a
          PLEXY_FORCE_APK: ${{ inputs.mobile_force_apk || (inputs.mobile_update_type != '' && inputs.mobile_update_type != 'optional') || (inputs.mobile_version_bump != '' && inputs.mobile_version_bump != 'patch') }}

  android:
    name: Android mobile APK
    needs: mobile-delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: needs.mobile-delivery.outputs.delivery == 'apk'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Cache Gradle dependencies and task outputs
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Cache Android native compilation
        uses: actions/cache@v5
        with:
          path: |
            apps/mobile/android/.gradle
            apps/mobile/android/app/.cxx
            apps/mobile/android/app/build/intermediates/cxx
          key: android-arm64-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/app.config.ts', 'scripts/native/*.cjs') }}-${{ github.sha }}
          restore-keys: android-arm64-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/app.config.ts', 'scripts/native/*.cjs') }}-
      - name: Build standalone preview APK
        run: bun run build:mobile
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || secrets.EXPO_PUBLIC_TMDB_TOKEN || secrets.TMDB_ACCESS_TOKEN || secrets.VITE_PUBLIC_TMDB_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PLEXY_EXPO_PROJECT_ID: ${{ vars.PLEXY_EXPO_PROJECT_ID }}
          EXPO_PUBLIC_PLEXY_UPDATE_ORIGIN: ${{ vars.PLEXY_UPDATE_ORIGIN }}
          PLEXY_UPDATE_TYPE: ${{ inputs.mobile_update_type }}
          PLEXY_VERSION_BUMP: ${{ inputs.mobile_version_bump }}
          PLEXY_ANDROID_ARCHITECTURES: arm64-v8a
          # Use the standard public Linux runner's 4 vCPUs and 16 GB RAM.
          PLEXY_GRADLE_WORKERS: "4"
          PLEXY_GRADLE_JVMARGS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-android-mobile
          path: |
            .build/native/Plexy-*.apk
            .build/native/mobile-update.json
          if-no-files-found: error

  server-linux:
    name: Backend (linux-x64)
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      inputs.linux_backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/package-server
        with:
          platform: linux-x64
          contents: ${{ inputs.backend_contents }}

  macos:
    name: macOS package (${{ matrix.target }})
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    timeout-minutes: 90
    if: inputs.desktop || inputs.macos_backend
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.desktop && inputs.macos_backend && '["desktop","backend"]' || inputs.desktop && '["desktop"]' || '["backend"]') }}
    env:
      MACOS_TARGET: ${{ matrix.target }}
      PLEXY_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      PLEXY_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      BACKEND_CONTENTS: ${{ inputs.backend_contents }}
    steps:
      - uses: actions/checkout@v7
      - name: Queue and monitor GitHub macOS worker
        id: worker
        if: inputs.macos_runner != 'circleci'
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_RUNNER: ${{ inputs.macos_runner }}
        run: node scripts/github-macos.mjs
      - uses: actions/download-artifact@v8
        if: steps.worker.outputs.provider == 'github'
        with:
          name: macos-package
          path: release-macos
          run-id: ${{ steps.worker.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Build on CircleCI and download artifacts
        if: inputs.macos_runner == 'circleci' || steps.worker.outputs.provider == 'circleci'
        env:
          CIRCLE_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_PROJECT_SLUG: ${{ vars.CIRCLECI_PROJECT_SLUG }}
          CIRCLECI_PIPELINE_DEFINITION_ID: ${{ vars.CIRCLECI_PIPELINE_DEFINITION_ID }}
        run: node scripts/circleci-macos.mjs
      - name: Cancel GitHub worker if this release was cancelled
        if: cancelled() && steps.worker.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_RUN_ID: ${{ steps.worker.outputs.run_id }}
        run: gh run cancel "$WORKER_RUN_ID"
      - name: Attach macOS assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HIGHLIGHTS: ${{ inputs.release_notes }}
        run: |
          notes="$(mktemp)"
          if [[ "$MACOS_TARGET" == desktop ]]; then
            printf 'Apple Silicon desktop app. The app is ad-hoc signed and requires approval in macOS Privacy & Security on first launch.\n' > "$notes"
          elif [[ "$BACKEND_CONTENTS" == binary ]]; then
            printf 'Apple Silicon backend executable. Supply the runtime files separately.\n' > "$notes"
          else
            printf 'Apple Silicon backend bundle with the web UI, migrations, and FFmpeg.\n' > "$notes"
          fi
          if [[ -n "$RELEASE_HIGHLIGHTS" ]]; then
            printf '\n%s\n' "$RELEASE_HIGHLIGHTS" >> "$notes"
          fi
          PLEXY_KEEP_RELEASE_NOTES=true bash scripts/publish-release.sh "$notes" release-macos/*

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - plan
      - checks
      - android
      - server-linux
    # macOS jobs publish their assets independently.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      (needs.server-linux.result == 'success' || needs.android.result == 'success') &&
      needs.plan.result == 'success' &&
      needs.checks.result == 'success' &&
      !cancelled()
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download Linux backend
        if: needs.server-linux.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: plexy-server-linux-x64
          path: release

      - name: Download Android APK
        if: ${{ !cancelled() && needs.android.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: plexy-android-mobile
          path: release

      - name: Publish mobile version and startup update policy
        id: mobile-release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f release/mobile-update.json ]; then
            version="$(node -p "JSON.parse(require('fs').readFileSync('release/mobile-update.json','utf8')).latestVersion")"
            apk="$(node -p "JSON.parse(require('fs').readFileSync('release/mobile-update.json','utf8')).apkName")"
            tag="mobile-v${version}"
            # Publish the installable APK first; only then advertise the policy.
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "release/$apk" release/mobile-update.json --clobber
            else
              gh release create "$tag" "release/$apk" release/mobile-update.json --target "$GITHUB_SHA" --latest=false --title "Plexy Mobile ${version}" --notes-file release/mobile-update.json
            fi
            if gh release view mobile-latest --json assets --jq '.assets[].name' | grep -qx mobile-update.json; then
              current_policy="$(mktemp)"
              gh release download mobile-latest --pattern mobile-update.json --output "$current_policy" --clobber
              latest_version="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).latestVersion' "$current_policy")"
              if [[ "$(printf '%s\n' "$version" "$latest_version" | sort -V | tail -1)" != "$version" ]]; then
                echo "Keeping the newer Android startup policy for $latest_version."
                exit 0
              fi
            elif ! gh release view mobile-latest >/dev/null 2>&1; then
              gh release create mobile-latest --title "Plexy Mobile update policy" --notes "Stable mobile startup update policy." --latest=false
            fi
            gh release upload mobile-latest release/mobile-update.json --clobber
            echo "mirror=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror the latest Android APK to R2
        if: steps.mobile-release.outputs.mirror == 'true' && vars.PLEXY_UPDATE_R2_BUCKET != '' && vars.PLEXY_UPDATE_ORIGIN != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLEXY_UPDATE_R2_BUCKET: ${{ vars.PLEXY_UPDATE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PLEXY_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PLEXY_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash scripts/mirror-android-update.sh release/mobile-update.json

      - name: Create update checksums
        if: ${{ !cancelled() && steps.mobile-release.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p release
          cd release
          shopt -s nullglob
          files=(*.dmg *.zip *.apk *.tar.gz)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS
          fi

      - name: Create or update release
        if: ${{ !cancelled() && steps.mobile-release.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLEXY_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
          PLEXY_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_HIGHLIGHTS: ${{ inputs.release_notes }}
          BACKEND_CONTENTS: ${{ inputs.backend_contents }}
        run: |
          set -euo pipefail

          version="$PLEXY_RELEASE_VERSION"
          tag="v${version}-build.${PLEXY_BUILD_NUMBER}"
          if [[ "$version" == *-beta.* ]]; then
            release_title="Plexy Beta ${tag}"
          else
            release_title="Plexy ${tag}"
          fi

          mac_paragraph="_macOS assets are attached separately when Apple Silicon builds succeed._"

          mobile_paragraph=""
          if compgen -G 'release/Plexy-mobile-*.apk' >/dev/null; then
            mobile_paragraph="**Android phone/tablet:** install the **Plexy-mobile-…apk** asset. Phone APKs target ARM64."
          fi

          cat > release-notes.md <<EOF
          ## ${release_title}

          This release contains the targets selected at dispatch.

          ${mac_paragraph}

          ${mobile_paragraph}

          **Backend bundle:** extract the archive for your platform and run \`./plexy-server\`. Keep FFmpeg, migrations, and the web folder beside the executable. Set \`PLEXY_DATA_DIR\` to choose the data folder. The browser UI is included: open the server address, or pass \`--no-ui\` for API-only operation.

          This release is ad-hoc signed, but it is not Developer ID signed or notarized. On first launch, macOS may say it cannot verify Plexy and block it. After trying to open Plexy from Applications:

          1. Open **System Settings → Privacy & Security**.
          2. Scroll to **Security** and click **Open Anyway** next to the Plexy message.
          3. Confirm with your password or Touch ID, then open Plexy again from **Applications** and choose **Open**.

          On some macOS versions, Control-click **Plexy.app** in Applications, choose **Open**, and confirm **Open**. If macOS still blocks it, use the Privacy & Security steps above. Only do this for a copy downloaded from this repository's GitHub Releases page.

          Advanced Terminal alternative:

              xattr -dr com.apple.quarantine "/Applications/Plexy.app"

          The web app asks for your Plexy server address on first launch and remembers it on that device. The Mac app includes its own server, which can be disabled in client settings.

          Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`.
          EOF
          if [[ "$BACKEND_CONTENTS" == binary ]]; then
            printf '\nBackend binary archives contain only the executable. Supply the runtime files separately.\n' >> release-notes.md
          fi
          if [[ -n "$RELEASE_HIGHLIGHTS" ]]; then
            printf '\n%s\n' "$RELEASE_HIGHLIGHTS" >> release-notes.md
          fi

          shopt -s nullglob
          assets=(release/*.apk release/*.tar.gz)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::warning::No installable artifacts were built for the main release."
            exit 0
          fi
          assets+=(release/SHA256SUMS)
          if compgen -G "release/*.apk" >/dev/null && [ -f release/mobile-update.json ]; then
            assets+=(release/mobile-update.json)
          fi
          bash scripts/publish-release.sh release-notes.md "${assets[@]}"
