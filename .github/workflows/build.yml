name: Build & Release

# Runs on push to `main` (with automatic target detection) or manual dispatch
# targeting specific components (mobile, desktop, backend, or all).
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Target component to build and release"
        required: true
        default: "mobile"
        type: choice
        options:
          - all
          - mobile
          - desktop
          - backend

concurrency:
  group: plexy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22"

jobs:
  plan:
    name: Determine build targets
    runs-on: ubuntu-24.04
    outputs:
      build_desktop: ${{ steps.targets.outputs.build_desktop }}
      build_mobile: ${{ steps.targets.outputs.build_mobile }}
      build_server: ${{ steps.targets.outputs.build_server }}
      any_build: ${{ steps.targets.outputs.any_build }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Detect targets
        id: targets
        env:
          BUILD_TARGET: ${{ inputs.target || '' }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bun scripts/build-targets.ts

  checks:
    name: Tests and type checks
    needs: plan
    if: needs.plan.outputs.any_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Verify target selection
        run: bun test scripts/build-targets.test.ts
      - name: Build and verify embedded website
        if: needs.plan.outputs.build_server == 'true' || needs.plan.outputs.build_desktop == 'true'
        run: bun run build:web && bun run --filter @plexy/web typecheck
      - name: Verify backend
        if: needs.plan.outputs.build_server == 'true' || needs.plan.outputs.build_desktop == 'true'
        run: bun run --filter @plexy/server typecheck && bun run test:server
      - name: Verify desktop
        if: needs.plan.outputs.build_desktop == 'true'
        run: bun x tsc --noEmit -p apps/desktop/tsconfig.json && bun run test:desktop
      - name: Verify Android clients
        if: needs.plan.outputs.build_mobile == 'true'
        run: bun run typecheck:native && bun run test:native
      - name: Save verified website
        if: needs.plan.outputs.build_server == 'true' || needs.plan.outputs.build_desktop == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verified-web
          path: dist/web
          if-no-files-found: error

  mac:
    name: macOS app (Apple Silicon)
    needs: [plan, checks]
    runs-on: macos-15
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.build_desktop == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        env:
          SKIP_FFMPEG: "true"
        run: bun install --frozen-lockfile

      - name: Cache FFmpeg runtime
        uses: actions/cache@v5
        with:
          path: node_modules/node-av/binary
          key: ffmpeg-macos-arm64-v1-${{ hashFiles('bun.lock', 'scripts/install-macos-ffmpeg.mjs') }}

      - name: Ensure FFmpeg runtime is installed
        run: node scripts/install-macos-ffmpeg.mjs

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-macos-arm64-${{ hashFiles('bun.lock') }}
          restore-keys: electron-macos-arm64-

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Reuse verified website
        uses: actions/download-artifact@v8
        with:
          name: verified-web
          path: dist/web

      - name: Build macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PLEXY_REUSE_WEB_BUILD: "true"
        run: bun run package:mac

      - name: Show artifacts
        run: ls -lh dist/mac

      - name: Verify desktop release version
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/mac/mac-arm64/Plexy Beta.app/Contents/Info.plist')"
          test "$actual" = "$expected" || { echo "Desktop version $actual does not match release $expected"; exit 1; }

      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 "dist/mac/mac-arm64/Plexy Beta.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plexy-macos
          path: |
            dist/mac/*.dmg
            dist/mac/*.zip
          if-no-files-found: error
          retention-days: 14

      # The release job no longer waits for macOS runners (GitHub's arm64 pool
      # can stay queued for a long time). This step attaches the app to the same
      # tag as soon as the build finishes, creating the release first if needed.
      - name: Publish macOS assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          build_num=$(( 2000 + GITHUB_RUN_NUMBER ))
          tag="v${version}-build.${build_num}"
          if [[ "$version" == *-beta.* ]]; then
            prerelease_flag="--prerelease"
            release_title="Plexy Beta ${tag}"
          else
            prerelease_flag=""
            release_title="Plexy ${tag}"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$release_title" \
              --target "$GITHUB_SHA" \
              $prerelease_flag \
              --notes "macOS build assets are being attached. The full release notes appear once the other artifacts finish."
          fi
          gh release upload "$tag" dist/mac/*.dmg dist/mac/*.zip --clobber
          echo "Attached macOS assets to $tag"

  mac-fallback:
    name: macOS app (Apple Silicon, fallback pool)
    needs: [plan, checks, mac]
    runs-on: macos-14
    # GitHub occasionally cannot hand out a macos-15 arm64 runner within the
    # acquisition window. Try the other arm64 image once before giving up.
    if: |
      failure() &&
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.build_desktop == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        env:
          SKIP_FFMPEG: "true"
        run: bun install --frozen-lockfile

      - name: Cache FFmpeg runtime
        uses: actions/cache@v5
        with:
          path: node_modules/node-av/binary
          key: ffmpeg-macos-arm64-v1-${{ hashFiles('bun.lock', 'scripts/install-macos-ffmpeg.mjs') }}

      - name: Ensure FFmpeg runtime is installed
        run: node scripts/install-macos-ffmpeg.mjs

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Reuse verified website
        uses: actions/download-artifact@v8
        with:
          name: verified-web
          path: dist/web

      - name: Build macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PLEXY_REUSE_WEB_BUILD: "true"
        run: bun run package:mac

      - name: Verify desktop release version
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/mac/mac-arm64/Plexy Beta.app/Contents/Info.plist')"
          test "$actual" = "$expected" || { echo "Desktop version $actual does not match release $expected"; exit 1; }

      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 "dist/mac/mac-arm64/Plexy Beta.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plexy-macos
          path: |
            dist/mac/*.dmg
            dist/mac/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish macOS assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          build_num=$(( 2000 + GITHUB_RUN_NUMBER ))
          tag="v${version}-build.${build_num}"
          if [[ "$version" == *-beta.* ]]; then
            prerelease_flag="--prerelease"
            release_title="Plexy Beta ${tag}"
          else
            prerelease_flag=""
            release_title="Plexy ${tag}"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$release_title" \
              --target "$GITHUB_SHA" \
              $prerelease_flag \
              --notes "macOS build assets are being attached. The full release notes appear once the other artifacts finish."
          fi
          gh release upload "$tag" dist/mac/*.dmg dist/mac/*.zip --clobber
          echo "Attached macOS assets to $tag"

  android:
    name: Android mobile APK
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      (needs.plan.outputs.build_mobile == 'true')
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Cache Gradle dependencies and task outputs
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Cache Android native compilation
        uses: actions/cache@v5
        with:
          path: |
            apps/mobile/android/.gradle
            apps/mobile/android/app/.cxx
            apps/mobile/android/app/build/intermediates/cxx
          key: android-arm64-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/app.config.ts', 'scripts/native/*.cjs') }}-${{ github.sha }}
          restore-keys: android-arm64-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/app.config.ts', 'scripts/native/*.cjs') }}-
      - name: Build standalone preview APK
        run: bun scripts/native/build-preview.ts
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || secrets.EXPO_PUBLIC_TMDB_TOKEN || secrets.TMDB_ACCESS_TOKEN || secrets.VITE_PUBLIC_TMDB_ACCESS_TOKEN }}
          PLEXY_ANDROID_ARCHITECTURES: arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-android-mobile
          path: |
            .build/native/Plexy-*.apk
          if-no-files-found: error

  server:
    name: Backend (${{ matrix.platform }})
    needs: [plan, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.build_server == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - if: runner.os == 'macOS'
        run: node scripts/install-macos-ffmpeg.mjs
      - uses: actions/download-artifact@v8
        with:
          name: verified-web
          path: dist/web
      - run: bun run build:server
        env:
          PLEXY_REUSE_WEB_BUILD: "true"
      - name: Smoke test backend
        run: ./dist/server/plexy-server --version
      - run: tar -czf dist/plexy-server-${{ matrix.platform }}.tar.gz -C dist/server .
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-server-${{ matrix.platform }}
          path: dist/plexy-server-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - plan
      - checks
      - android
      - server
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.any_build == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: plexy-*
          merge-multiple: true
          path: release

      - name: Verify selected release artifacts
        env:
          BUILD_DESKTOP: ${{ needs.plan.outputs.build_desktop }}
          BUILD_MOBILE: ${{ needs.plan.outputs.build_mobile }}
          BUILD_SERVER: ${{ needs.plan.outputs.build_server }}
        shell: bash
        run: |
          set -euo pipefail
          require_asset() { compgen -G "release/$1" >/dev/null || { echo "Missing release asset: $1"; exit 1; }; }
          if [ "$BUILD_DESKTOP" = true ]; then
            version="$(node -p "require('./package.json').version")"
            if compgen -G "release/Plexy Beta-${version}-arm64.dmg" >/dev/null; then
              require_asset "Plexy Beta-${version}-arm64.zip"
            else
              echo "::warning::macOS assets are not ready; the macOS job attaches them to this release when it finishes."
            fi
          fi
          if [ "$BUILD_MOBILE" = true ]; then require_asset 'Plexy-mobile-*.apk'; fi
          if [ "$BUILD_SERVER" = true ]; then
            require_asset 'plexy-server-linux-x64.tar.gz'
            require_asset 'plexy-server-macos-arm64.tar.gz'
          fi

      - name: Create update checksums
        shell: bash
        run: |
          mkdir -p release
          cd release
          shopt -s nullglob
          files=(*.dmg *.zip *.apk *.tar.gz)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS
          fi

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          # Give every successful run its own release, including beta builds.
          # Re-running a workflow intentionally updates that run's release.
          # Base offset of 2000 ensures build numbers exceed any legacy preview builds (1000+)
          # and keeps Android versionCode strictly increasing to allow in-place updates.
          build_num=$(( 2000 + GITHUB_RUN_NUMBER ))
          tag="v${version}-build.${build_num}"
          if [[ "$version" == *-beta.* ]]; then
            prerelease_flag="--prerelease"
            latest_flag=""
            release_title="Plexy Beta ${tag}"
          else
            prerelease_flag=""
            latest_flag="--latest"
            release_title="Plexy ${tag}"
          fi

          if compgen -G "release/Plexy Beta-"*.dmg >/dev/null; then
            mac_paragraph="**Install on Apple Silicon Mac:** download the DMG, open it, drag **Plexy** into **Applications**, wait for it to finish copying, then eject the DMG. You can also download the ZIP, extract it, and move **Plexy.app** into **Applications**."
          else
            mac_paragraph="_The macOS app is still being produced on GitHub's Apple Silicon runners. It is attached to this release automatically as soon as a runner is available._"
          fi

          cat > release-notes.md <<EOF
          ## ${release_title}

          Only components affected by this change are attached to this release.

          ${mac_paragraph}

          **Android phone/tablet:** install the **Plexy-mobile-…apk** asset. Phone APKs target ARM64. These standalone preview APKs use the template test signing identity and are not store releases.

          **Backend:** extract the archive for your platform and run \`./plexy-server\`. Keep FFmpeg, migrations, and the web folder beside the executable. Set \`PLEXY_DATA_DIR\` to choose the data folder. The browser UI is included: open the server address, or pass \`--no-ui\` for API-only operation.

          This release is ad-hoc signed, but it is not Developer ID signed or notarized. On first launch, macOS may say it cannot verify Plexy and block it. After trying to open Plexy from Applications:

          1. Open **System Settings → Privacy & Security**.
          2. Scroll to **Security** and click **Open Anyway** next to the Plexy message.
          3. Confirm with your password or Touch ID, then open Plexy again from **Applications** and choose **Open**.

          On some macOS versions, Control-click **Plexy.app** in Applications, choose **Open**, and confirm **Open**. If macOS still blocks it, use the Privacy & Security steps above. Only do this for a copy downloaded from this repository's GitHub Releases page.

          Advanced Terminal alternative:

              xattr -dr com.apple.quarantine "/Applications/Plexy.app"

          The web app asks for your Plexy server address on first launch and remembers it on that device. The Mac app includes its own server, which can be disabled in client settings.

          Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`.
          EOF

          shopt -s nullglob
          release_files=(release/*)

          if [ ${#release_files[@]} -gt 0 ]; then
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${release_files[@]}" --clobber
              gh release edit "$tag" --notes-file release-notes.md --title "$release_title"
            else
              gh release create "$tag" "${release_files[@]}" \
                --title "$release_title" \
                --notes-file release-notes.md \
                --target "$GITHUB_SHA" \
                $prerelease_flag $latest_flag
            fi
          else
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file release-notes.md --title "$release_title"
            else
              gh release create "$tag" \
                --title "$release_title" \
                --notes-file release-notes.md \
                --target "$GITHUB_SHA" \
                $prerelease_flag $latest_flag
            fi
          fi
