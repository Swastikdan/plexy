name: Build & Release

# Runs on push to `main` (with automatic target detection) or manual dispatch
# targeting specific components (mobile, tv, desktop, backend, web, or all).
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Target component to build and release"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - mobile
          - tv
          - desktop
          - backend
          - web

concurrency:
  group: plexy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22"

jobs:
  plan:
    name: Determine build targets
    runs-on: ubuntu-24.04
    outputs:
      build_web: ${{ steps.targets.outputs.build_web }}
      build_desktop: ${{ steps.targets.outputs.build_desktop }}
      build_mobile: ${{ steps.targets.outputs.build_mobile }}
      build_tv: ${{ steps.targets.outputs.build_tv }}
      build_server: ${{ steps.targets.outputs.build_server }}
      android_targets: ${{ steps.targets.outputs.android_targets }}
      any_build: ${{ steps.targets.outputs.any_build }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Detect targets
        id: targets
        env:
          BUILD_TARGET: ${{ inputs.target || '' }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bun scripts/build-targets.ts

  checks:
    name: Tests and type checks
    needs: plan
    if: needs.plan.outputs.any_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Verify target selection
        run: bun test scripts/build-targets.test.ts
      - name: Build and verify embedded website
        if: needs.plan.outputs.build_web == 'true' || needs.plan.outputs.build_desktop == 'true'
        run: bun run build:web && bun run --filter @plexy/web typecheck
        env:
          VITE_API_URL: ${{ vars.PLEXY_DEFAULT_SERVER_URL }}
      - name: Verify backend
        if: needs.plan.outputs.build_server == 'true' || needs.plan.outputs.build_desktop == 'true'
        run: bun run --filter @plexy/server typecheck && bun run test:server
      - name: Verify desktop
        if: needs.plan.outputs.build_desktop == 'true'
        run: bun x tsc --noEmit -p apps/desktop/tsconfig.json
      - name: Verify Android clients
        if: needs.plan.outputs.build_mobile == 'true' || needs.plan.outputs.build_tv == 'true'
        run: bun run typecheck:native && bun run test:native
      - name: Save verified website
        if: needs.plan.outputs.build_web == 'true' || needs.plan.outputs.build_desktop == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verified-web
          path: dist/web
          if-no-files-found: error

  web:
    name: Web app build
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.build_web == 'true'
    outputs:
      site_url: ${{ vars.PLEXY_SITE_URL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-web
          path: dist/web
      - name: Package website
        run: tar -czf plexy-web.tar.gz -C dist/web .
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-web
          path: plexy-web.tar.gz
          if-no-files-found: error

  mac:
    name: macOS app (Apple Silicon)
    needs: [plan, checks]
    runs-on: macos-15
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.build_desktop == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        env:
          SKIP_FFMPEG: "true"
        run: bun install --frozen-lockfile

      - name: Cache FFmpeg runtime
        uses: actions/cache@v4
        with:
          path: node_modules/node-av/binary
          key: ffmpeg-macos-arm64-v1-${{ hashFiles('bun.lock', 'scripts/install-macos-ffmpeg.mjs') }}

      - name: Ensure FFmpeg runtime is installed
        run: node scripts/install-macos-ffmpeg.mjs

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-macos-arm64-${{ hashFiles('bun.lock') }}
          restore-keys: electron-macos-arm64-

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Reuse verified website
        uses: actions/download-artifact@v8
        with:
          name: verified-web
          path: dist/web

      - name: Build macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PLEXY_REUSE_WEB_BUILD: "true"
        run: bun run package:mac

      - name: Show artifacts
        run: ls -lh dist/mac

      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 "dist/mac/mac-arm64/Plexy Beta.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plexy-macos
          path: |
            dist/mac/*.dmg
            dist/mac/*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ${{ matrix.target }} APK
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.android_targets) }}
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      (needs.plan.outputs.build_mobile == 'true' || needs.plan.outputs.build_tv == 'true')
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Build standalone preview APK
        run: bun scripts/native/build-preview.ts ${{ matrix.target }}
        env:
          PLEXY_ANDROID_ARCHITECTURES: arm64-v8a,armeabi-v7a,x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-android-${{ matrix.target }}
          path: .build/native/plexy-${{ matrix.target }}-preview.apk
          if-no-files-found: error

  server:
    name: Backend (${{ matrix.platform }})
    needs: [plan, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.build_server == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - if: runner.os == 'macOS'
        run: node scripts/install-macos-ffmpeg.mjs
      - run: bun run build:server
      - name: Smoke test backend
        run: ./dist/server/plexy-server --version
      - run: tar -czf dist/plexy-server-${{ matrix.platform }}.tar.gz -C dist/server .
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-server-${{ matrix.platform }}
          path: dist/plexy-server-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - plan
      - web
      - mac
      - checks
      - android
      - server
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.any_build == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: plexy-*
          merge-multiple: true
          path: release

      - name: Verify selected release artifacts
        env:
          BUILD_WEB: ${{ needs.plan.outputs.build_web }}
          BUILD_DESKTOP: ${{ needs.plan.outputs.build_desktop }}
          BUILD_MOBILE: ${{ needs.plan.outputs.build_mobile }}
          BUILD_TV: ${{ needs.plan.outputs.build_tv }}
          BUILD_SERVER: ${{ needs.plan.outputs.build_server }}
        shell: bash
        run: |
          set -euo pipefail
          require_asset() { compgen -G "release/$1" >/dev/null || { echo "Missing release asset: $1"; exit 1; }; }
          if [ "$BUILD_WEB" = true ]; then require_asset 'plexy-web.tar.gz'; fi
          if [ "$BUILD_DESKTOP" = true ]; then require_asset '*.dmg'; require_asset '*.zip'; fi
          if [ "$BUILD_MOBILE" = true ]; then require_asset 'plexy-mobile-preview.apk'; fi
          if [ "$BUILD_TV" = true ]; then require_asset 'plexy-tv-preview.apk'; fi
          if [ "$BUILD_SERVER" = true ]; then
            require_asset 'plexy-server-linux-x64.tar.gz'
            require_asset 'plexy-server-macos-arm64.tar.gz'
          fi

      - name: Create update checksums
        shell: bash
        run: |
          mkdir -p release
          cd release
          shopt -s nullglob
          files=(*.dmg *.zip *.apk *.tar.gz)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS
          fi

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ needs.web.outputs.site_url || vars.PLEXY_SITE_URL }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          # Give every successful run its own release, including beta builds.
          # Re-running a workflow intentionally updates that run's release.
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          if [[ "$version" == *-beta.* ]]; then
            prerelease_flag="--prerelease"
            latest_flag=""
          else
            prerelease_flag=""
            latest_flag="--latest"
          fi

          cat > release-notes.md <<EOF
          ## Plexy Beta ${tag}

          **Web app:** ${SITE_URL} (when configured). Download \`plexy-web.tar.gz\` to host the built website.

          Only components affected by this change are attached to this release.

          **Install on Apple Silicon Mac:** download the DMG, open it, drag **Plexy Beta** into **Applications**, wait for it to finish copying, then eject the DMG. You can also download the ZIP, extract it, and move **Plexy Beta.app** into **Applications**.

          **Android phone/tablet:** install \`plexy-mobile-preview.apk\`. **Android TV:** sideload \`plexy-tv-preview.apk\`. These standalone preview APKs use the template test signing identity and are not store releases.

          **Backend:** extract the archive for your platform and run \`./plexy-server\`. Keep FFmpeg and migrations beside the executable. Set \`PLEXY_DATA_DIR\` to choose the data folder. Backend archives do not include the web app; connect a Plexy client.

          This release is ad-hoc signed, but it is not Developer ID signed or notarized. On first launch, macOS may say it cannot verify Plexy and block it. After trying to open Plexy from Applications:

          1. Open **System Settings → Privacy & Security**.
          2. Scroll to **Security** and click **Open Anyway** next to the Plexy message.
          3. Confirm with your password or Touch ID, then open Plexy again from **Applications** and choose **Open**.

          On some macOS versions, Control-click **Plexy.app** in Applications, choose **Open**, and confirm **Open**. If macOS still blocks it, use the Privacy & Security steps above. Only do this for a copy downloaded from this repository's GitHub Releases page.

          Advanced Terminal alternative:

              xattr -dr com.apple.quarantine "/Applications/Plexy Beta.app"

          The web app asks for your Plexy server address on first launch and remembers it on that device. The Mac app includes its own server.

          Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`.
          EOF

          shopt -s nullglob
          release_files=(release/*)

          if [ ${#release_files[@]} -gt 0 ]; then
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${release_files[@]}" --clobber
              gh release edit "$tag" --notes-file release-notes.md
            else
              gh release create "$tag" "${release_files[@]}" \
                --title "Plexy Beta ${tag}" \
                --notes-file release-notes.md \
                --target "$GITHUB_SHA" \
                $prerelease_flag $latest_flag
            fi
          else
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file release-notes.md
            else
              gh release create "$tag" \
                --title "Plexy Beta ${tag}" \
                --notes-file release-notes.md \
                --target "$GITHUB_SHA" \
                $prerelease_flag $latest_flag
            fi
          fi
