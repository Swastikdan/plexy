name: Build & Release

# Runs on push to `main` (with automatic target detection) or manual dispatch
# targeting specific components (mobile, desktop, backend, or all).
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Target component to build and release"
        required: true
        default: "mobile"
        type: choice
        options:
          - all
          - mobile
          - desktop
          - backend
      mobile_update_type:
        description: "Mobile update urgency"
        type: choice
        default: optional
        options: [optional, feature, necessary]
      mobile_version_bump:
        description: "Mobile version increment"
        type: choice
        default: patch
        options: [patch, minor, major]
      mobile_force_apk:
        description: "Publish a new Android APK even when OTA is compatible"
        type: boolean
        default: false

concurrency:
  group: plexy-${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22"

jobs:
  plan:
    name: Determine build targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_desktop: ${{ steps.targets.outputs.build_desktop }}
      build_mobile: ${{ steps.targets.outputs.build_mobile }}
      build_server: ${{ steps.targets.outputs.build_server }}
      any_build: ${{ steps.targets.outputs.any_build }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Detect targets
        id: targets
        env:
          BUILD_TARGET: ${{ inputs.target || '' }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bun scripts/build-targets.ts

  checks:
    name: Tests and type checks
    needs: plan
    if: needs.plan.outputs.any_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Verify target selection
        run: bun test scripts/build-targets.test.ts scripts/native/mobile-delivery-state.test.ts
      - name: Verify shared packages
        run: bun run turbo run typecheck typecheck:scripts --filter=@plexy/api-client --filter=@plexy/local-library --filter=//
      - name: Build and verify embedded website
        if: needs.plan.outputs.build_server == 'true' || needs.plan.outputs.build_desktop == 'true'
        run: bun run turbo run typecheck --filter=@plexy/web
      - name: Install FFmpeg for preparation integration tests
        if: needs.plan.outputs.build_server == 'true' || needs.plan.outputs.build_desktop == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
      - name: Verify backend
        if: needs.plan.outputs.build_server == 'true' || needs.plan.outputs.build_desktop == 'true'
        run: bun run turbo run typecheck test --filter=@plexy/server
      - name: Verify desktop
        if: needs.plan.outputs.build_desktop == 'true'
        run: bun run turbo run typecheck test --filter=@plexy/desktop
      - name: Verify Android clients
        if: needs.plan.outputs.build_mobile == 'true'
        # Typecheck the suites separately from the Expo app and verify Metro's export.
        run: bun run turbo run typecheck typecheck:tests lint:strict bundle --filter=@plexy/mobile
      - name: Enforce mobile coverage floor
        if: needs.plan.outputs.build_mobile == 'true'
        run: bun run test:native:coverage
      - name: Save mobile coverage
        if: needs.plan.outputs.build_mobile == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: .build/coverage/native/lcov.info
          if-no-files-found: warn
      - name: Save verified website
        if: needs.plan.outputs.build_server == 'true' || needs.plan.outputs.build_desktop == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verified-web
          path: dist/web
          if-no-files-found: error

  mac:
    name: macOS app (Apple Silicon)
    needs: [plan, checks]
    runs-on: macos-15
    # A missing Apple Silicon runner must never hold the release hostage.
    continue-on-error: true
    timeout-minutes: 75
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.build_desktop == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: ./.github/actions/package-macos

  mac-fallback:
    name: macOS app (Apple Silicon, fallback pool)
    needs: [plan, checks, mac]
    runs-on: macos-14
    # GitHub occasionally cannot hand out a macos-15 arm64 runner within the
    # acquisition window. Try the other arm64 image once before giving up.
    continue-on-error: true
    timeout-minutes: 75
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.result == 'success' &&
      needs.checks.result == 'success' &&
      needs.plan.outputs.build_desktop == 'true' &&
      needs.mac.result != 'success'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: ./.github/actions/package-macos

  mobile-delivery:
    name: Route Android delivery
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.build_mobile == 'true'
    outputs:
      delivery: ${{ steps.route.outputs.delivery }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Compare published Android release and publish compatible OTA
        id: route
        working-directory: apps/mobile
        run: bun scripts/delivery.ts publish
        env:
          CI: "true"
          NODE_ENV: production
          EXPO_NO_DOTENV: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || secrets.EXPO_PUBLIC_TMDB_TOKEN || secrets.TMDB_ACCESS_TOKEN || secrets.VITE_PUBLIC_TMDB_ACCESS_TOKEN }}
          PLEXY_EXPO_PROJECT_ID: ${{ vars.PLEXY_EXPO_PROJECT_ID }}
          PLEXY_ANDROID_ARCHITECTURES: arm64-v8a
          PLEXY_FORCE_APK: ${{ inputs.mobile_force_apk || (inputs.mobile_update_type != '' && inputs.mobile_update_type != 'optional') || (inputs.mobile_version_bump != '' && inputs.mobile_version_bump != 'patch') }}

  android:
    name: Android mobile APK
    needs: mobile-delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: needs.mobile-delivery.outputs.delivery == 'apk'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Cache Gradle dependencies and task outputs
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Cache Android native compilation
        uses: actions/cache@v5
        with:
          path: |
            apps/mobile/android/.gradle
            apps/mobile/android/app/.cxx
            apps/mobile/android/app/build/intermediates/cxx
          key: android-arm64-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/app.config.ts', 'scripts/native/*.cjs') }}-${{ github.sha }}
          restore-keys: android-arm64-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/app.config.ts', 'scripts/native/*.cjs') }}-
      - name: Build standalone preview APK
        run: bun run build:mobile
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || secrets.EXPO_PUBLIC_TMDB_TOKEN || secrets.TMDB_ACCESS_TOKEN || secrets.VITE_PUBLIC_TMDB_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PLEXY_EXPO_PROJECT_ID: ${{ vars.PLEXY_EXPO_PROJECT_ID }}
          PLEXY_UPDATE_TYPE: ${{ inputs.mobile_update_type }}
          PLEXY_VERSION_BUMP: ${{ inputs.mobile_version_bump }}
          PLEXY_ANDROID_ARCHITECTURES: arm64-v8a
          # Use the standard public Linux runner's 4 vCPUs and 16 GB RAM.
          PLEXY_GRADLE_WORKERS: "4"
          PLEXY_GRADLE_JVMARGS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-android-mobile
          path: |
            .build/native/Plexy-*.apk
            .build/native/mobile-update.json
          if-no-files-found: error

  server:
    name: Backend (${{ matrix.platform }})
    needs: [plan, checks]
    # Publish whatever platforms build; one bad target does not block the rest.
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    if: |
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      needs.plan.outputs.build_server == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        env:
          SKIP_FFMPEG: "true"
      - name: Cache FFmpeg runtime
        uses: actions/cache@v5
        with:
          path: node_modules/node-av/binary
          key: ffmpeg-${{ matrix.platform }}-v1-${{ hashFiles('bun.lock', 'scripts/install-ffmpeg.mjs') }}
      - name: Ensure FFmpeg runtime is installed
        run: node scripts/install-ffmpeg.mjs
      - uses: actions/download-artifact@v8
        with:
          name: verified-web
          path: dist/web
      - run: bun run turbo run assemble:server --filter=@plexy/server
      - name: Smoke test backend
        run: |
          ./dist/server/ffmpeg -version
          ./dist/server/plexy-server --version
      - run: tar -czf dist/plexy-server-${{ matrix.platform }}.tar.gz -C dist/server .
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-server-${{ matrix.platform }}
          path: dist/plexy-server-*.tar.gz
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - plan
      - checks
      - android
      - mobile-delivery
      - server
    # Artifact builds (macOS/Android/backend) are best-effort: the release still
    # publishes whatever succeeded. Only planning and verification must pass.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor)) &&
      (needs.plan.outputs.build_desktop == 'true' || needs.plan.outputs.build_server == 'true' || needs.mobile-delivery.outputs.delivery == 'apk') &&
      needs.plan.result == 'success' &&
      needs.checks.result == 'success' &&
      !cancelled()
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download release artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: plexy-*
          merge-multiple: true
          path: release

      - name: Ensure release folder exists
        run: mkdir -p release

      - name: Verify selected release artifacts
        env:
          BUILD_DESKTOP: ${{ needs.plan.outputs.build_desktop }}
          BUILD_MOBILE: ${{ needs.mobile-delivery.outputs.delivery == 'apk' }}
          BUILD_SERVER: ${{ needs.plan.outputs.build_server }}
        shell: bash
        run: |
          set -euo pipefail
          warn_missing() { echo "::warning::Missing release asset: $1 — publishing without it."; }
          have_asset() { compgen -G "release/$1" >/dev/null; }
          if [ "$BUILD_DESKTOP" = true ]; then
            version="$(node -p "require('./package.json').version")"
            if have_asset "Plexy Beta-${version}-arm64.dmg"; then
              have_asset "Plexy Beta-${version}-arm64.zip" || warn_missing "Plexy Beta-${version}-arm64.zip"
            else
              echo "::warning::macOS assets are not available for this run; the release is published without them."
            fi
          fi
          if [ "$BUILD_MOBILE" = true ] && ! have_asset 'Plexy-mobile-*.apk'; then
            warn_missing 'Plexy-mobile-*.apk'
          fi
          if [ "$BUILD_SERVER" = true ]; then
            have_asset 'plexy-server-linux-x64.tar.gz' || warn_missing 'plexy-server-linux-x64.tar.gz'
            have_asset 'plexy-server-macos-arm64.tar.gz' || warn_missing 'plexy-server-macos-arm64.tar.gz'
          fi

      - name: Publish mobile version and startup update policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f release/mobile-update.json ]; then
            version="$(node -p "JSON.parse(require('fs').readFileSync('release/mobile-update.json','utf8')).latestVersion")"
            apk="$(node -p "JSON.parse(require('fs').readFileSync('release/mobile-update.json','utf8')).apkName")"
            tag="mobile-v${version}"
            # Publish the installable APK first; only then advertise the policy.
            gh release upload "$tag" "release/$apk" release/mobile-update.json --clobber
            gh release edit "$tag" --draft=false --latest=false --title "Plexy Mobile ${version}" --notes-file release/mobile-update.json
            if ! gh release view mobile-latest >/dev/null 2>&1; then
              gh release create mobile-latest --title "Plexy Mobile update policy" --notes "Stable mobile startup update policy." --latest=false
            fi
            gh release upload mobile-latest release/mobile-update.json --clobber
          fi

      - name: Create update checksums
        if: needs.plan.outputs.build_desktop == 'true' || needs.plan.outputs.build_server == 'true' || hashFiles('release/Plexy-mobile-*.apk') != ''
        shell: bash
        run: |
          mkdir -p release
          cd release
          shopt -s nullglob
          files=(*.dmg *.zip *.apk *.tar.gz)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS
          fi

      - name: Create or update release
        if: needs.plan.outputs.build_desktop == 'true' || needs.plan.outputs.build_server == 'true' || hashFiles('release/Plexy-mobile-*.apk') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          # Give every successful run its own release, including beta builds.
          # Re-running a workflow intentionally updates that run's release.
          # Base offset of 2000 ensures build numbers exceed any legacy preview builds (1000+)
          # and keeps Android versionCode strictly increasing to allow in-place updates.
          build_num=$(( 2000 + GITHUB_RUN_NUMBER ))
          tag="v${version}-build.${build_num}"
          if [[ "$version" == *-beta.* ]]; then
            prerelease_flag="--prerelease"
            latest_flag=""
            release_title="Plexy Beta ${tag}"
          else
            prerelease_flag=""
            latest_flag="--latest"
            release_title="Plexy ${tag}"
          fi

          if compgen -G "release/Plexy Beta-"*.dmg >/dev/null; then
            mac_paragraph="**Install on Apple Silicon Mac:** download the DMG, open it, drag **Plexy** into **Applications**, wait for it to finish copying, then eject the DMG. You can also download the ZIP, extract it, and move **Plexy.app** into **Applications**."
          else
            mac_paragraph="_The macOS app is not attached to this run because an Apple Silicon runner was unavailable. Every other component below is complete; a macOS build may still attach itself here if one becomes available._"
          fi

          mobile_paragraph=""
          if compgen -G 'release/Plexy-mobile-*.apk' >/dev/null; then
            mobile_paragraph="**Android phone/tablet:** install the **Plexy-mobile-…apk** asset. Phone APKs target ARM64."
          fi

          cat > release-notes.md <<EOF
          ## ${release_title}

          Only components affected by this change are attached to this release.

          ${mac_paragraph}

          ${mobile_paragraph}

          **Backend:** extract the archive for your platform and run \`./plexy-server\`. Keep FFmpeg, migrations, and the web folder beside the executable. Set \`PLEXY_DATA_DIR\` to choose the data folder. The browser UI is included: open the server address, or pass \`--no-ui\` for API-only operation.

          This release is ad-hoc signed, but it is not Developer ID signed or notarized. On first launch, macOS may say it cannot verify Plexy and block it. After trying to open Plexy from Applications:

          1. Open **System Settings → Privacy & Security**.
          2. Scroll to **Security** and click **Open Anyway** next to the Plexy message.
          3. Confirm with your password or Touch ID, then open Plexy again from **Applications** and choose **Open**.

          On some macOS versions, Control-click **Plexy.app** in Applications, choose **Open**, and confirm **Open**. If macOS still blocks it, use the Privacy & Security steps above. Only do this for a copy downloaded from this repository's GitHub Releases page.

          Advanced Terminal alternative:

              xattr -dr com.apple.quarantine "/Applications/Plexy.app"

          The web app asks for your Plexy server address on first launch and remembers it on that device. The Mac app includes its own server, which can be disabled in client settings.

          Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`.
          EOF

          shopt -s nullglob
          release_files=(release/*)

          if [ ${#release_files[@]} -gt 0 ]; then
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${release_files[@]}" --clobber
              gh release edit "$tag" --notes-file release-notes.md --title "$release_title"
            else
              gh release create "$tag" "${release_files[@]}" \
                --title "$release_title" \
                --notes-file release-notes.md \
                --target "$GITHUB_SHA" \
                $prerelease_flag $latest_flag
            fi
          else
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file release-notes.md --title "$release_title"
            else
              gh release create "$tag" \
                --title "$release_title" \
                --notes-file release-notes.md \
                --target "$GITHUB_SHA" \
                $prerelease_flag $latest_flag
            fi
          fi
