name: Build & Release

# Runs only when the `build` branch receives a commit (for example after the
# owner merges main into build). Manual runs must target the `build` branch.
on:
  push:
    branches:
      - build
  workflow_dispatch:

concurrency:
  group: plexy-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22"

jobs:
  web:
    name: Web → Cloudflare Workers
    runs-on: ubuntu-latest
    # Only the owner (or logins listed in the RELEASE_ACTORS repository
    # variable) can publish. Branch protection should also restrict `build`.
    if: github.ref == 'refs/heads/build' && contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor))
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build:web
        env:
          # Optional: bake a default server address into the hosted build.
          # Viewers can still change it from the connection screen.
          VITE_API_URL: ${{ vars.PLEXY_DEFAULT_SERVER_URL }}

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLEXY_SITE_URL: ${{ vars.PLEXY_SITE_URL }}
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/wrangler-deploy.log

          if [ -n "${PLEXY_SITE_URL:-}" ]; then
            echo "url=${PLEXY_SITE_URL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Wrangler prints the deployment URL. Fall back to the account's
          # workers.dev subdomain if the output format changes.
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"

          if [ -z "$url" ]; then
            subdomain="$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              | jq -r '.result.subdomain // empty' || true)"
            worker_name="$(node -p "require('./wrangler.json').name")"
            if [ -n "$subdomain" ]; then
              url="https://${worker_name}.${subdomain}.workers.dev"
            fi
          fi

          if [ -z "$url" ]; then
            echo "::error::Could not determine the site URL. Set the PLEXY_SITE_URL repository variable to your Worker or custom domain URL."
            exit 1
          fi

          echo "url=${url}" >> "$GITHUB_OUTPUT"

    outputs:
      site_url: ${{ steps.deploy.outputs.url }}

  mac:
    name: macOS app (Apple Silicon)
    runs-on: macos-15
    if: github.ref == 'refs/heads/build' && contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor))
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Build macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run package:mac

      - name: Show artifacts
        run: ls -lh dist/mac

      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 dist/mac/mac-arm64/Plexy.app

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plexy-macos
          path: |
            dist/mac/*.dmg
            dist/mac/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - web
      - mac
    if: github.ref == 'refs/heads/build' && contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor))
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: plexy-macos
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ needs.web.outputs.site_url }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"

          cat > release-notes.md <<EOF
          ## Plexy ${tag}

          **Web app:** ${SITE_URL}

          **macOS (Apple Silicon):** download the DMG below, or the ZIP for a portable copy.

          The Mac app is ad-hoc signed but not notarized. On first launch, right-click **Plexy.app** and choose **Open**.

          The web app asks for your Plexy server address on first launch and remembers it on that device. The Mac app includes its own server.

          Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" release/* \
              --title "Plexy ${tag}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
