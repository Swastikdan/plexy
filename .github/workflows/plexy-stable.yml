name: Plexy Stable Mac

on:
  workflow_dispatch:
    inputs:
      app:
        description: Build the Plexy client, Plexy Server, or both
        type: choice
        options: [both, client, server]
        default: both
      draft_release:
        description: Create GitHub draft releases for the built apps
        type: boolean
        default: false
      release_notes:
        description: Notes to attach to the draft releases
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Test and package stable Mac apps
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Ensure the Metal shader compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent metalToolchain
            xcrun -sdk macosx metal --version
          fi
      - name: Install the player's Rust toolchain
        working-directory: apps/player-gpui
        run: rustup toolchain install
      - name: Run locked Rust tests
        working-directory: apps/player-gpui
        run: cargo test --locked --release -- --test-threads=1
      - name: Install libmpv
        run: brew install mpv
      - name: Build the bundled server
        if: inputs.app == 'server' || inputs.app == 'both'
        run: bun run build:server
      - name: Build Plexy
        if: inputs.app == 'client' || inputs.app == 'both'
        run: bun run build:plexy:mac
      - name: Build Plexy Server
        if: inputs.app == 'server' || inputs.app == 'both'
        run: bun run build:server:mac
      - name: Verify the disk images and write checksums
        working-directory: dist
        run: |
          images=()
          [[ -f player-mac/Plexy-1.1.0-mac-arm64.dmg ]] && images+=(player-mac/Plexy-1.1.0-mac-arm64.dmg)
          [[ -f server-mac/Plexy-Server-1.0.0-mac-arm64.dmg ]] && images+=(server-mac/Plexy-Server-1.0.0-mac-arm64.dmg)
          [[ ${#images[@]} -gt 0 ]]
          for image in "${images[@]}"; do hdiutil verify "$image"; done
          shasum -a 256 "${images[@]}" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: plexy-stable-mac-arm64
          path: |
            dist/player-mac/Plexy-1.1.0-mac-arm64.dmg
            dist/server-mac/Plexy-Server-1.0.0-mac-arm64.dmg
            dist/SHA256SUMS
          if-no-files-found: error

  draft:
    name: Draft GitHub releases
    needs: package
    if: |
      github.event_name == 'workflow_dispatch' && inputs.draft_release &&
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.RELEASE_ACTORS || github.repository_owner), format(',{0},', github.actor))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plexy-stable-mac-arm64
          path: release
      - name: Create draft releases
        working-directory: release
        run: |
          notes="${RELEASE_NOTES:-Stable Plexy macOS build.}"
          if [[ -f Plexy-1.1.0-mac-arm64.dmg ]]; then
            tag="plexy-v1.1.0"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release $tag already exists. Bump the app version before publishing again."
              exit 1
            fi
            gh release create "$tag" Plexy-1.1.0-mac-arm64.dmg SHA256SUMS \
              --draft --latest=false --target "$GITHUB_SHA" \
              --title "Plexy 1.1.0" --notes "$notes"
          fi
          if [[ -f Plexy-Server-1.0.0-mac-arm64.dmg ]]; then
            tag="plexy-server-v1.0.0"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release $tag already exists. Bump the server app version before publishing again."
              exit 1
            fi
            gh release create "$tag" Plexy-Server-1.0.0-mac-arm64.dmg SHA256SUMS \
              --draft --latest=false --target "$GITHUB_SHA" \
              --title "Plexy Server 1.0.0" --notes "$notes"
          fi
